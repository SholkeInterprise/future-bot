services:
  - type: web
    name: coinswitch-usdt-candle-hft
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 bot:app
    envVars:
      - key: ENABLE_LIVE_TRADING
        value: "true"
      - key: LIVE_CONFIRMATION
        value: "I_UNDERSTAND_REAL_ORDERS"
      - key: AUTO_TRADE
        value: "false"
      - key: COINSWITCH_API_KEY
        sync: false
      - key: COINSWITCH_SECRET_KEY
        sync: false
      - key: POLL_SECONDS
        value: "1"
      - key: MAX_SYMBOLS
        value: "80"
