services:
  - type: web
    name: future-bot-coinswitch
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 bot:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LIVE_TRADING
        value: "NO"
      - key: AUTO_TRADING
        value: "NO"
      - key: MAX_MARGIN_USDT
        value: "25"
      - key: DASHBOARD_USER
        value: admin
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: COINSWITCH_API_KEY
        sync: false
      - key: COINSWITCH_SECRET_KEY
        sync: false
