services:
  - type: web
    name: binance-futures-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 bot:app
    healthCheckPath: /healthz
    envVars:
      - key: BINANCE_TESTNET
        value: "NO"
      - key: LIVE_TRADING
        value: "NO"
      - key: AUTO_TRADING
        value: "NO"
      - key: MAX_MARGIN_USDT
        value: "25"
      - key: DASHBOARD_USER
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
